name: Twist normal form verification

on:
  push:
    paths:
      - 'twist-normal-form-lean/**'
      - '.github/workflows/twist-normal-form-lean.yml'
  pull_request:
    paths:
      - 'twist-normal-form-lean/**'
      - '.github/workflows/twist-normal-form-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate 1 (required): full build in Lean's kernel.  lean-action installs
      # the pinned toolchain, fetches the Mathlib cache, and runs `lake build`.
      # Note: `lake build` alone does NOT fail on a `sorry` (Lean only warns);
      # the no-`sorry` guarantee for tracked persisted `RadicalRelativity`
      # declarations is enforced by Gate 2's census, not here (an anonymous
      # `example := by sorry` persists no declaration and is a source-review
      # item, not a census-caught one).  nanoda is intentionally NOT used: an external re-check would
      # have to re-export RadicalRelativity's full transitive Mathlib closure,
      # impractical on a runner, and the axiom policy is enforced in-kernel by
      # Gate 2.
      - name: Build in Lean's kernel
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: twist-normal-form-lean
          build: true
          test: false
          nanoda: false

      # Gate 2 (required, non-skipping): five-layer audit.  `AxiomAudit.lean`
      # fails elaboration if ANY tracked persisted `RadicalRelativity` declaration
      # depends on `sorryAx` or an axiom outside the three core axioms plus the two
      # disclosed cited axioms; if the two cited axioms are not the only tracked-tree
      # custom axioms; if the tracked module set does not equal the source tree
      # on disk or the frozen 26-name manifest (a new unimported module, a removed
      # import, or a coordinated module+import deletion); if a principal
      # advertised endpoint's closure is not exactly the three core axioms; if a
      # named fidelity pin's or S1--S7 field's type, or a cited axiom's printed
      # type, drifts; or if an effect-boundary body pin (S2, `IsEffect`, `Effect`,
      # `EffectProduct`) or a class constructor (`SequentialProduct.mk`,
      # `SequentialProductCore.mk`) drifts.
      # `-DwarningAsError=true` so an audit-file `sorry` warning is fatal too.
      # `!cancelled()` so a failure in another gate cannot silently skip this one.
      - name: Census axioms, gate closure allowlist and fidelity
        if: ${{ !cancelled() }}
        working-directory: twist-normal-form-lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          lean --version | tee ci-artifacts/toolchain.txt
          lake --version | tee -a ci-artifacts/toolchain.txt
          lake env lean -DwarningAsError=true AxiomAudit.lean 2>&1 | tee ci-artifacts/axiom-audit.log
          git rev-parse HEAD | tee ci-artifacts/git-commit.txt
          sha256sum lean-toolchain lake-manifest.json AxiomAudit.lean \
            RadicalRelativity/PaperA/AuditPins.lean verify_n2.py \
            > ci-artifacts/input-sha256.txt

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.13'

      # Gate 3 (required, non-skipping; the only checker that does not use the
      # Lean toolchain): exact symbolic corroboration of the rank-two
      # identities.  Runs even if a Lean gate failed, so a Lean error cannot
      # mask a SymPy regression.
      - name: Run exact symbolic rank-two corroboration
        if: ${{ !cancelled() }}
        working-directory: twist-normal-form-lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python -c 'import sympy; print(sympy.__version__)' \
            | tee ci-artifacts/sympy-version.txt
          python verify_n2.py 2>&1 | tee ci-artifacts/verify-n2.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twist-normal-form-verification-${{ github.sha }}
          path: twist-normal-form-lean/ci-artifacts/
          if-no-files-found: warn
