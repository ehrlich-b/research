name: Twist normal form verification

on:
  push:
    paths:
      - 'twist-normal-form-lean/**'
      - '.github/workflows/twist-normal-form-lean.yml'
  pull_request:
    paths:
      - 'twist-normal-form-lean/**'
      - '.github/workflows/twist-normal-form-lean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gate 1 (required): full build in Lean's kernel, zero `sorry`.
      # lean-action installs the pinned toolchain, fetches the Mathlib cache,
      # and runs `lake build`.  nanoda is intentionally NOT used here: an
      # external re-check would have to re-export RadicalRelativity's full
      # transitive Mathlib closure, which is impractical on a runner, and the
      # precise axiom policy is instead enforced in-kernel by Gate 2 below.
      - name: Build in Lean kernel (zero sorry)
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: twist-normal-form-lean
          build: true
          test: false
          nanoda: false

      # Gate 2 (required, independent): axiom-closure allowlist + statement
      # fidelity.  `AxiomAudit.lean` fails elaboration unless every principal
      # advertised theorem has exactly Lean's three core axioms and the two
      # product-level target shapes match their definitions.  `!cancelled()`
      # so a failure in another gate cannot silently skip this one.
      - name: Gate axiom closure and statement fidelity
        if: ${{ !cancelled() }}
        working-directory: twist-normal-form-lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          lean --version | tee ci-artifacts/toolchain.txt
          lake --version | tee -a ci-artifacts/toolchain.txt
          lake env lean AxiomAudit.lean 2>&1 | tee ci-artifacts/axiom-audit.log
          git rev-parse HEAD | tee ci-artifacts/git-commit.txt
          sha256sum lean-toolchain lake-manifest.json AxiomAudit.lean verify_n2.py \
            > ci-artifacts/input-sha256.txt

      - uses: actions/setup-python@v5
        if: ${{ !cancelled() }}
        with:
          python-version: '3.13'

      # Gate 3 (required, independent of Lean): exact symbolic corroboration of
      # the rank-two identities.  Runs even if a Lean gate failed, so a Lean
      # error cannot mask a SymPy regression.
      - name: Run exact symbolic rank-two corroboration
        if: ${{ !cancelled() }}
        working-directory: twist-normal-form-lean
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-artifacts
          python -m pip install --disable-pip-version-check 'sympy==1.14.0'
          python -c 'import sympy; print(sympy.__version__)' \
            | tee ci-artifacts/sympy-version.txt
          python verify_n2.py 2>&1 | tee ci-artifacts/verify-n2.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twist-normal-form-verification-${{ github.sha }}
          path: twist-normal-form-lean/ci-artifacts/
          if-no-files-found: warn
